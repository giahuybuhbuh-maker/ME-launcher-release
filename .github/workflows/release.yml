name: Build ME Launcher (3 OS + Setup)

on:
  workflow_dispatch: # Cho phep bam nut chay thu cong tren web GitHub
  push:
    tags:
      - 'v*'         # Tu dong chay va tao Release khi day tag (vd: v0.1.7)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat OpenJDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cai dat Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0.0

      - name: Dong goi jpackageImage
        run: gradle clean jpackageImage --no-daemon

      - name: Nen ban Windows (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/dist/*" -DestinationPath "ME-Launcher-Windows-x64.zip" -Force

      - name: Build ME-Launcher-Setup.exe bang NSIS
        if: runner.os == 'Windows'
        working-directory: packaging
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }

          $nsisArgs = @("/V3")
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tagUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ME-Launcher-Windows-x64.zip"
            $nsisArgs += "/DDOWNLOAD_URL=$tagUrl"
          }
          $nsisArgs += "ME-Launcher-Setup-Online.nsi"

          & $makensis @nsisArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Move-Item -Path "ME-Launcher-Setup.exe" -Destination "..\ME-Launcher-Setup.exe" -Force

      - name: Nen ban Linux (.tar.gz giu quyen +x)
        if: runner.os == 'Linux'
        run: |
          tar -czf ME-Launcher-Linux-x64.tar.gz -C build/dist .

      - name: Nen ban macOS (.zip giu symlink .app)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/dist/ME Launcher.app" "ME-Launcher-macOS-arm64.zip"

      - name: Luu file build tam (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ME-Launcher-${{ matrix.platform }}
          path: ME-Launcher-*

      - name: Dang len GitHub Releases (khi co tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ME-Launcher-*
