name: Build ME Launcher (3 OS + Setup)

on:
  workflow_dispatch: # Cho phep bam nut chay thu cong tren web GitHub
  push:
    tags:
      - 'v*'         # Tu dong chay va tao Release khi day tag (vd: v0.1.7)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v4

      - name: Cai dat OpenJDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Cai dat Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.0.0

      - name: Dong goi jpackageImage
        run: gradle clean jpackageImage --no-daemon

      - name: Smoke Test Linux (chay thu 10s tren man hinh ao)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi

          APP_BIN="$GITHUB_WORKSPACE/build/dist/ME Launcher/bin/ME Launcher"
          test -x "$APP_BIN" || { echo "Khong tim thay file chay Linux: $APP_BIN"; exit 1; }

          cd /tmp
          JAVA_TOOL_OPTIONS="-Dprism.order=sw" xvfb-run -a "$APP_BIN" > /tmp/smoke-linux.log 2>&1 &
          APP_PID=$!

          sleep 10

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "=== OK: ME Launcher van song sau 10 giay tren Linux ==="
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "=== CRASH: ME Launcher bi thoat som tren Linux ==="
            cat /tmp/smoke-linux.log || true
            exit 1
          fi

          echo "=== Log chay thu Linux ==="
          cat /tmp/smoke-linux.log || true

          if grep -Eq "Failed to launch JVM|Loi khong xac dinh|Khong the mo man hinh chinh" /tmp/smoke-linux.log; then
            echo "=== PHAT HIEN LOI NGHIEM TRONG TRONG LOG ==="
            exit 1
          fi

      - name: Smoke Test macOS (chay thu 10s)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BIN="$GITHUB_WORKSPACE/build/dist/ME Launcher.app/Contents/MacOS/ME Launcher"
          test -x "$APP_BIN" || { echo "Khong tim thay file chay macOS: $APP_BIN"; exit 1; }

          cd /tmp
          JAVA_TOOL_OPTIONS="-Dprism.order=sw" "$APP_BIN" > /tmp/smoke-macos.log 2>&1 &
          APP_PID=$!

          sleep 10

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "=== OK: ME Launcher van song sau 10 giay tren macOS ==="
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          else
            echo "=== CRASH: ME Launcher bi thoat som tren macOS ==="
            cat /tmp/smoke-macos.log || true
            exit 1
          fi

          echo "=== Log chay thu macOS ==="
          cat /tmp/smoke-macos.log || true

          if grep -Eq "Failed to launch JVM|Loi khong xac dinh|Khong the mo man hinh chinh" /tmp/smoke-macos.log; then
            echo "=== PHAT HIEN LOI NGHIEM TRONG TRONG LOG ==="
            exit 1
          fi

      - name: Nen ban Windows (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "build/dist/*" -DestinationPath "ME-Launcher-Windows-x64.zip" -Force

      - name: Build ME-Launcher-Setup.exe bang NSIS
        if: runner.os == 'Windows'
        working-directory: packaging
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }

          $nsisArgs = @("/V3")
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tagUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ME-Launcher-Windows-x64.zip"
            $nsisArgs += "/DDOWNLOAD_URL=$tagUrl"
          }
          $nsisArgs += "ME-Launcher-Setup-Online.nsi"

          & $makensis @nsisArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Move-Item -Path "ME-Launcher-Setup.exe" -Destination "..\ME-Launcher-Setup.exe" -Force

      - name: Nen ban Linux (.tar.gz giu quyen +x)
        if: runner.os == 'Linux'
        run: |
          tar -czf ME-Launcher-Linux-x64.tar.gz -C build/dist .

      - name: Nen ban macOS (.zip giu symlink .app)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/dist/ME Launcher.app" "ME-Launcher-macOS-arm64.zip"

      - name: Luu file build tam (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ME-Launcher-${{ matrix.platform }}
          path: ME-Launcher-*

      - name: Dang len GitHub Releases (khi co tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ME-Launcher-*