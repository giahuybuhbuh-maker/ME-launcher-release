plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.melauncher'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // JDK 25 la LTS hien tai, di kem voi dong JavaFX 25.x on dinh
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Bat buoc UTF-8 de comment/chuoi tieng Viet trong code khong bi loi
// khi build tren may co encoding mac dinh khac (hay gap tren Windows).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javafx {
    version = '25.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    // Dung de doc/ghi file cau hinh JSON (config/launcher.json)
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'launcher.Main'
}

tasks.named('run') {
    // Chay voi working directory la goc du an, de logs/, config/, game/...
    // duoc tao dung cho theo cau truc du an, khong bi lech sang thu muc khac.
    workingDir = rootDir
}

// Dong goi thanh app-image: 1 thu muc portable chua san .exe + JRE rieng
// (nguoi dung cuoi KHONG can cai Java). Chay: gradle jpackageImage
// Ket qua nam o: build/dist/ME Launcher/ME Launcher.exe
tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Dong goi launcher thanh app-image (.exe portable) bang jpackage'
    dependsOn 'installDist'

    def installDir = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
    def destDir = layout.buildDirectory.dir("dist").get().asFile
    def iconFile = file('src/main/resources/assets/icon.ico')
    // Lay duong dan luc CAU HINH (an toan) de dung lai luc CHAY ben duoi,
    // tranh goi truc tiep cac ham cua Project (project.delete/copy) luc
    // thuc thi - kieu goi nay dang bi Gradle canh bao se cam hoan toan.
    def packagingDir = file('packaging')

    doFirst {
        destDir.deleteDir() // ham co san cua Groovy tren File, khong phai Project API
    }

    def cmd = [
            'jpackage',
            '--type', 'app-image',
            '--input', installDir.absolutePath,
            '--dest', destDir.absolutePath,
            '--name', 'ME Launcher',
            '--main-jar', "${project.name}-${project.version}.jar",
            '--main-class', 'launcher.Main',
            '--app-version', project.version.toString()
    ]
    // Neu ban da bo icon.ico that vao src/main/resources/assets/, tu dong dung luon
    if (iconFile.exists()) {
        cmd += ['--icon', iconFile.absolutePath]
    }
    commandLine = cmd

    // Sau khi dong goi xong, tu dong copy kem cac file tao shortcut Desktop
    // (ca .vbs lan .bat - tuy may co the chan cai nay nhung khong chan cai kia)
    // vao chung thu muc voi ME Launcher.exe. Dung File.bytes (Groovy GDK)
    // thay vi copy{} (goi Project.copy luc thuc thi) cung vi ly do tren.
    doLast {
        def destFolder = new File(destDir, 'ME Launcher')
        ['Tao-shortcut-Desktop.vbs', 'Tao-shortcut-Desktop.bat'].each { fileName ->
            def source = new File(packagingDir, fileName)
            def target = new File(destFolder, fileName)
            target.bytes = source.bytes
        }
    }
}
