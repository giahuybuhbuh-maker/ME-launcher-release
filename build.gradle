plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.melauncher'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        // JDK 25 la LTS hien tai, di kem voi dong JavaFX 25.x on dinh
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Bat buoc UTF-8 de comment/chuoi tieng Viet trong code khong bi loi
// khi build tren may co encoding mac dinh khac (hay gap tren Windows).
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

javafx {
    version = '25.0.1'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics' ]
}

dependencies {
    // Dung de doc/ghi file cau hinh JSON (config/launcher.json)
    implementation 'com.google.code.gson:gson:2.11.0'

    // 1. OSHI: Đọc % CPU và dung lượng RAM phần cứng thời gian thực
    implementation 'com.github.oshi:oshi-core:6.6.5'
    implementation 'org.slf4j:slf4j-nop:2.0.16' // Tắt cảnh báo log thừa của OSHI

    // 2. WaifUPnP: Dành cho Tab Server ở bản v0.1.8 (bản v0.1.7 chưa dùng nên tạm ẩn để tránh lỗi tải & nhẹ file)
    // implementation 'com.simtechdata:WaifUPnP:1.2.1'
}

application {
    mainClass = 'launcher.Main'
}

tasks.named('run') {
    // Chay voi working directory la goc du an, de logs/, config/, game/...
    // duoc tao dung cho theo cau truc du an, khong bi lech sang thu muc khac.
    workingDir = rootDir
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '--enable-native-access=ALL-UNNAMED'
    ]
}

// Dong goi thanh app-image: 1 thu muc portable chua san .exe/.app + JRE rieng
// (nguoi dung cuoi KHONG can cai Java). Chay: gradle jpackageImage
// Ket qua nam o: build/dist/ME Launcher (Windows/Linux) hoac build/dist/ME Launcher.app (macOS)
tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Dong goi launcher thanh app-image portable bang jpackage (Windows/Linux/macOS)'
    dependsOn 'installDist'

    def installDir = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
    def destDir = layout.buildDirectory.dir("dist").get().asFile
    def packagingDir = file('packaging')

    // Tu dong chon dung dinh dang icon theo he dieu hanh dang build
    def osName = System.getProperty('os.name').toLowerCase()
    def isWindows = osName.contains('win')
    def isLinux = osName.contains('linux')
    def isMac = osName.contains('mac')

    File iconFile = null
    if (isWindows) {
        iconFile = file('src/main/resources/assets/ME_Launcher.ico')
        if (!iconFile.exists()) {
            iconFile = file('src/main/resources/assets/icon.ico')
        }
    } else if (isLinux) {
        iconFile = file('src/main/resources/assets/logo.png')
    } else if (isMac) {
        iconFile = file('src/main/resources/assets/ME_Launcher.icns')
    }

    doFirst {
        destDir.deleteDir() // ham co san cua Groovy tren File, khong phai Project API
    }

    def cmd = [
            'jpackage',
            '--type', 'app-image',
            '--input', installDir.absolutePath,
            '--dest', destDir.absolutePath,
            '--name', 'ME Launcher',
            '--main-jar', "${project.name}-${project.version}.jar",
            '--main-class', 'launcher.Main',
            '--app-version', project.version.toString(),
            '--java-options', '-Xms32m',
            '--java-options', '-Xmx160m',
            '--java-options', '-XX:+UseSerialGC',
            '--java-options', '-XX:MinHeapFreeRatio=10',
            '--java-options', '-XX:MaxHeapFreeRatio=20',
            '--java-options', '-XX:TieredStopAtLevel=1',
            '--java-options', '-XX:MaxMetaspaceSize=96m',
            '--java-options', '-XX:ReservedCodeCacheSize=32m',
            '--java-options', '-Dfile.encoding=UTF-8',
            '--java-options', '--enable-native-access=ALL-UNNAMED',
            '--jlink-options', '--strip-native-commands --strip-debug --no-man-pages --no-header-files --compress=zip-9'
    ]
    if (iconFile != null && iconFile.exists()) {
        cmd += ['--icon', iconFile.absolutePath]
    }
    commandLine = cmd

    // Chi copy 2 file tao shortcut Windows (.vbs/.bat) khi build tren Windows
    // de tranh loi FileNotFoundException tren macOS (noi jpackage tao ME Launcher.app)
    doLast {
        if (isWindows) {
            def destFolder = new File(destDir, 'ME Launcher')
            if (destFolder.exists()) {
                ['Tao-shortcut-Desktop.vbs', 'Tao-shortcut-Desktop.bat'].each { fileName ->
                    def source = new File(packagingDir, fileName)
                    if (source.exists()) {
                        def target = new File(destFolder, fileName)
                        target.bytes = source.bytes
                    }
                }
            }
        }
    }
}